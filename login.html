<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Cosmic Canvas</title>
  <link rel="icon" type="image/png" href="logo.png">
  <!-- Add Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
  <!-- Add Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Shadows+Into+Light+Two&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Google Sans Flex', sans-serif;
    }

    body {
      background: #fbfbfb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #1d1d1f;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.04) 0%, transparent 40%);
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 60px;
      background: white;
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 32px;
      z-index: 1;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
    }

    .title {
      font-size: 36px;
      letter-spacing: -1.5px;
      margin-bottom: 12px;
      font-weight: 500 !important;
      color: #000;
    }

    .subtitle {
      font-size: 14px;
      color: #86868b;
      font-weight: 500;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-field {
      width: 100%;
      height: 60px;
      background: #f5f5f7;
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      transition: all 0.3s ease;
    }

    .input-field:focus-within {
      background: #fff;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .input-field i {
      color: #86868b;
      margin-right: 16px;
      font-size: 16px;
    }

    .input-field input {
      background: none;
      border: none;
      outline: none;
      color: #000;
      width: 100%;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      height: 60px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 16px;
    }

    .btn:hover {
      background: #4f46e5;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 40px 0;
      color: #86868b;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #f0f0f0;
    }

    .divider span {
      padding: 0 20px;
    }

    .social-btn {
      width: 100%;
      height: 60px;
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 16px;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    .social-btn:hover {
      background: #fbfbfb;
      border-color: #e0e0e0;
    }

    .footer {
      text-align: center;
      margin-top: 50px;
      font-size: 13px;
      color: #86868b;
    }

    .footer a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 8px;
    }

    .error-message.show {
      opacity: 1;
    }

    .footer a {
      color: #6366f1;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo.png" alt="Cosmic Canvas Logo" class="logo">
      <h1 class="title">Welcome Back</h1>
      <p class="subtitle">Sign in to continue your journey</p>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <div class="input-field">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" placeholder="Email" required autocomplete="email">
        </div>
      </div>
      <div class="input-group">
        <div class="input-field">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" id="password" placeholder="Password" required autocomplete="current-password">
          <i class="fas fa-eye-slash toggle-password" id="togglePassword" style="cursor: pointer; margin-left: 10px;"></i>
        </div>
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="error-message" id="login-error"></div>
    </form>

    <div class="divider">
      <span>or continue with</span>
    </div>

    <button class="social-btn" id="googleSignInBtn">
      <i class="fab fa-google"></i>
      Google
    </button>

    <div class="footer">
      New here? <a href="signup.html">Create an account</a>
    </div>
  </div>

  <script>
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCfxC230uQw4WB_iALCYFMXniZfQwUkpfc",
      authDomain: "cosmiccanvas-6b5a0.firebaseapp.com",
      projectId: "cosmiccanvas-6b5a0",
      storageBucket: "cosmiccanvas-6b5a0.firebasestorage.app",
      messagingSenderId: "190984165965",
      appId: "1:190984165965:web:bd6df8b9efcecdbba35a04",
      measurementId: "G-3XMK86XT6M"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const analytics = firebase.analytics();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // Set persistence to NONE - user will need to login each time
    auth.setPersistence(firebase.auth.Auth.Persistence.NONE)
      .catch((error) => {
        console.error("Error setting persistence:", error);
      });

    // Development settings
    auth.settings.appVerificationDisabledForTesting = true;
    
    // Configure Google provider
    googleProvider.setCustomParameters({
      prompt: 'select_account'
    });

    const loginForm = document.getElementById('loginForm');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const errorMessage = document.getElementById('login-error');

    // Handle email/password login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = loginForm.email.value;
      const password = loginForm.password.value;

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        if (userCredential.user) {
          window.location.href = 'tool.html';
        }
      } catch (error) {
        showError(error.message);
      }
    });

    // Handle Google sign in
    googleSignInBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        const result = await auth.signInWithPopup(googleProvider);
        if (result.user) {
          window.location.href = 'tool.html';
        }
      } catch (error) {
        showError(error.message);
      }
    });

    // Show error message
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 3000);
    }

    // Add password visibility toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });
  </script>
</body>
</html>
